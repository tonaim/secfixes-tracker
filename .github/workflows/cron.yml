name: Update secfixes tracker
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    container:
      image: python:3.9-alpine
    env:
      FLASK_APP: secfixes_tracker
      SECFIXES_TRACKER_CONFIG: application.cfg

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          apk add --no-cache alpine-sdk gcc musl-dev libc-dev apk-tools
          # Verify libapk library is available (should be installed by apk-tools)
          echo "Searching for libapk library..."
          find /lib /usr/lib /lib64 /usr/lib64 -name "libapk*" 2>/dev/null || true
          # Set LD_LIBRARY_PATH to include standard library directories
          echo "LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64:/lib64" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Debug libapk loading
        run: |
          echo "=== Finding libapk files ==="
          find /usr /lib -name "*libapk*" 2>/dev/null
          echo ""
          echo "=== Checking library metadata ==="
          apk info -L apk-tools | grep libapk
          echo ""
          echo "=== Testing with Python ==="
          python3 << 'PYEOF'
from ctypes import cdll
import ctypes.util
import os

print(f"LD_LIBRARY_PATH: {os.environ.get('LD_LIBRARY_PATH', 'NOT SET')}")

# Try find_library
lib_path = ctypes.util.find_library('apk')
print(f"ctypes.util.find_library('apk'): {lib_path}")

# Try each path
attempts = [
    'libapk.so.2.14.1',
    'libapk.so.2.14.0', 
    'libapk.so',
    '/usr/lib/libapk.so',
    '/lib/libapk.so',
    '/usr/lib/libapk.so.2.14.1',
    '/lib/libapk.so.2.14.1',
]

for name in attempts:
    try:
        lib = cdll.LoadLibrary(name)
        print(f"✓ SUCCESS: {name}")
        print(f"  Library object: {lib}")
        break
    except Exception as e:
        print(f"✗ FAILED: {name} - {e}")
PYEOF

      - name: Initialize DB
        run: flask init-db

      - name: Import APKINDEX
        run: flask import-apkindex

      - name: Import secfixes
        run: flask import-secfixes

      - name: Import NVD
        run: |
          for year in $(seq 2018 $(date "+%Y")); do
            flask import-nvd $year
          done

      - name: Update states
        run: flask update-states

      - name: Clean existing files
        run: rm -rf data && mkdir data

      - name: Export JSON files
        run: flask export

      - name: Compress
        run: |
          tar cvfz all.tar.gz data
          mkdir -p public
          mv all.tar.gz public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public