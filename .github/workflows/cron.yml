name: Update secfixes tracker
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    container:
      image: python:3.9-alpine
    env:
      FLASK_APP: secfixes_tracker
      SECFIXES_TRACKER_CONFIG: application.cfg

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          apk add --no-cache alpine-sdk gcc musl-dev libc-dev apk-tools
          echo "=== Searching for libapk library ==="
          find / -name "libapk*" 2>/dev/null || true
          echo "=== Checking /usr/lib ==="
          ls -la /usr/lib/ | grep apk || true
          echo "=== Checking /lib ==="
          ls -la /lib/ | grep apk || true
          # Set LD_LIBRARY_PATH to include standard library directories
          echo "LD_LIBRARY_PATH=/usr/lib:/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Debug library loading
        run: |
          echo "=== LD_LIBRARY_PATH: $LD_LIBRARY_PATH ==="
          echo "=== Testing Python ctypes library loading ==="
          python3 -c "
from ctypes import cdll
import ctypes.util
import os

print('LD_LIBRARY_PATH:', os.environ.get('LD_LIBRARY_PATH', 'NOT SET'))
print('Trying to find apk library...')
lib_path = ctypes.util.find_library('apk')
print(f'find_library(apk): {lib_path}')

for lib_name in ['libapk.so.2.14.1', 'libapk.so.2.14.0', 'libapk.so', 'apk', '/usr/lib/libapk.so', '/lib/libapk.so']:
    try:
        lib = cdll.LoadLibrary(lib_name)
        print(f'✓ Successfully loaded: {lib_name}')
        break
    except OSError as e:
        print(f'✗ Failed to load {lib_name}: {e}')
"

      - name: Initialize DB
        run: flask init-db

      - name: Import APKINDEX
        run: flask import-apkindex

      - name: Import secfixes
        run: flask import-secfixes

      - name: Import NVD
        run: |
          for year in $(seq 2018 $(date "+%Y")); do
            flask import-nvd $year
          done

      - name: Update states
        run: flask update-states

      - name: Clean existing files
        run: rm -rf data && mkdir data

      - name: Export JSON files
        run: flask export

      - name: Compress
        run: |
          tar cvfz all.tar.gz data
          mkdir -p public
          mv all.tar.gz public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public