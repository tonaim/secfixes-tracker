name: Update secfixes tracker
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    container:
      image: python:3.9-alpine
    env:
      FLASK_APP: secfixes_tracker
      SECFIXES_TRACKER_CONFIG: application.cfg

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          apk add --no-cache alpine-sdk gcc musl-dev libc-dev apk-tools
          echo "=== After installing apk-tools ==="
          ls -la /lib/libapk* 2>/dev/null || echo "No libapk in /lib"
          ls -la /usr/lib/libapk* 2>/dev/null || echo "No libapk in /usr/lib"
          # Create symlinks for both libapk versions (2.14.0 for Alpine 3.18-3.19, 2.14.1 for 3.20+)
          if [ -f /lib/libapk.so ]; then
            ln -sf /lib/libapk.so /lib/libapk.so.2.14.0
            ln -sf /lib/libapk.so /lib/libapk.so.2.14.1
            echo "Created symlinks in /lib:"
            ls -la /lib/libapk*
          elif [ -f /usr/lib/libapk.so ]; then
            ln -sf /usr/lib/libapk.so /usr/lib/libapk.so.2.14.0
            ln -sf /usr/lib/libapk.so /usr/lib/libapk.so.2.14.1
            echo "Created symlinks in /usr/lib:"
            ls -la /usr/lib/libapk*
          else
            echo "WARNING: libapk.so not found in /lib or /usr/lib!"
          fi
          # Set LD_LIBRARY_PATH for additional robustness
          echo "LD_LIBRARY_PATH=/usr/lib:/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Debug - Find libapk files
        run: |
          echo "=== Searching entire filesystem for libapk ==="
          find / -name "*libapk*" 2>/dev/null || echo "No libapk files found"
          echo ""
          echo "=== Checking what apk-tools package installed ==="
          apk info -L apk-tools | grep -i apk || echo "Package query failed"
          echo ""
          echo "=== Listing /lib ==="
          ls -la /lib/ | grep -i apk || echo "No apk files in /lib"
          echo ""
          echo "=== Listing /usr/lib ==="
          ls -la /usr/lib/ | grep -i apk || echo "No apk files in /usr/lib"
          echo ""
          echo "=== LD_LIBRARY_PATH ==="
          echo "$LD_LIBRARY_PATH"
          echo ""
          echo "=== Testing library loading with Python ==="
          python3 -c "
from ctypes import cdll
import ctypes.util
import os
import glob

print('Files matching *libapk* in /lib:', glob.glob('/lib/*libapk*'))
print('Files matching *libapk* in /usr/lib:', glob.glob('/usr/lib/*libapk*'))

found = False
for path in ['/lib', '/usr/lib']:
    print(f'\\nTrying LoadLibrary with paths from {path}:')
    for name in ['libapk.so.2.14.1', 'libapk.so.2.14.0', 'libapk.so', 'libapk.so.3']:
        full_path = f'{path}/{name}'
        try:
            lib = cdll.LoadLibrary(full_path)
            print(f'  ✓ SUCCESS: {full_path}')
            found = True
            break
        except Exception as e:
            print(f'  ✗ {full_path}: {e}')
    if found:
        break

if not found:
    print('\\nWARNING: All library loading attempts failed')
    print('The Initialize DB step will likely fail')
" || echo "Debug script completed with warnings"

      - name: Initialize DB
        run: flask init-db

      - name: Import APKINDEX
        run: flask import-apkindex

      - name: Import secfixes
        run: flask import-secfixes

      - name: Import NVD
        run: |
          for year in $(seq 2018 $(date "+%Y")); do
            flask import-nvd $year
          done

      - name: Update states
        run: flask update-states

      - name: Clean existing files
        run: rm -rf data && mkdir data

      - name: Export JSON files
        run: flask export

      - name: Compress
        run: |
          tar cvfz all.tar.gz data
          mkdir -p public
          mv all.tar.gz public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public